<g stroke="#1E2A44" stroke-width="5" stroke-linejoin="round"><path d="M110 520 L420 470 L424 482 L114 534Z" fill="#E8B56A"/><path d="M130 550 L440 490 L444 502 L134 562Z" fill="#E8B56A"/></g>
