  </g>
</defs>
<rect width="800" height="600" fill="#FFF3D1"/>
<g opacity=".35" stroke-linecap="round" stroke-width="6" fill="none"><path d="M60 70l18 8" stroke="#FF8FC4"/><path d="M720 90l8 18" stroke="#7DB9F7"/><path d="M80 520l16-6" stroke="#3CC48A"/><path d="M700 530l-14 10" stroke="#FFD23F"/></g>
