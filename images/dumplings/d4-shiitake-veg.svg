<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="香菇素食水餃">
<defs>
  <g id="dp">
    <path d="M-78 18 C-80 -48 80 -48 78 18 C44 40 -44 40 -78 18Z" fill="#E6F6D9" stroke="#1E2A44" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-50 -16 q8 10 2 22 M-22 -28 q8 12 2 26 M8 -30 q8 12 2 26 M36 -22 q8 10 2 22" fill="none" stroke="#1E2A44" stroke-width="4" stroke-linecap="round"/>
    <path d="M-58 14 q20 10 40 10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="mush">
    <path d="M-16 0 L-20 56 C-20 66 20 66 20 56 L16 0Z" fill="#FFF1DC" stroke="#1E2A44" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-74 6 C-74 -60 74 -60 74 6 C40 22 -40 22 -74 6Z" fill="#8B5A3C" stroke="#1E2A44" stroke-width="5" stroke-linejoin="round"/>
